<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crisp HiDPI Canvas Rendering with devicePixelRatio</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #1c1917;
        color: #e7e5e4;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 28px 16px 48px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
        text-align: center;
      }
      .row {
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .panel h2 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        color: #a8a29e;
      }
      .panel.hidpi h2 {
        color: #a78bfa;
      }
      canvas {
        display: block;
        border: 1px solid #44403c;
        border-radius: 4px;
        background: #fafaf9;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        background: #292524;
        color: #e7e5e4;
        border: 1px solid #57534e;
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      button.active {
        background: #7c3aed;
        border-color: #7c3aed;
        color: #fff;
      }
      #hud {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        line-height: 1.7;
        color: #d6d3d1;
        background: #292524;
        border: 1px solid #44403c;
        border-radius: 8px;
        padding: 12px 18px;
        min-width: 320px;
      }
      #hud b {
        color: #a78bfa;
      }
      .mkare-demo-bar {
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(24, 24, 27, 0.88);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 12px;
        line-height: 1;
        color: #e7e5e4;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
      .mkare-demo-bar a {
        color: #a78bfa;
        text-decoration: none;
        font-weight: 600;
      }
      .mkare-demo-bar a:hover { text-decoration: underline; }
      .mkare-demo-bar .sep { color: #57534e; }
    </style>
  </head>
  <body>
    <nav class="mkare-demo-bar" aria-label="Article and resources">
      <a href="https://javascript.plainenglish.io/why-does-canvas-look-blurry-on-retina-displays-devicepixelratio-and-the-tale-of-two-sizes-2be8f6e6f7f8?source=friends_link&sk=3c3af29a65f3d3238efd567f24c20b00" target="_blank" rel="noopener">Read Deep Dive (Free)</a>
      <span class="sep">·</span>
      <a href="https://www.buymeacoffee.com/mkare/e/599265" target="_blank" rel="noopener">Get Starter Kit</a>
      <span class="sep">·</span>
      <a href="https://github.com/m2-md/hidpi-canvas-devicepixelratio" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <h1>Same Canvas, Two Distinct Dimensions: devicePixelRatio</h1>

    <div class="controls">
      <span>Simulated DPR:</span>
      <button data-dpr="1">1×</button>
      <button data-dpr="2">2×</button>
      <button data-dpr="3">3×</button>
    </div>

    <div class="row">
      <div class="panel naive">
        <h2>Naive (no setup → blurry)</h2>
        <canvas id="naive"></canvas>
      </div>
      <div class="panel hidpi">
        <h2>HiDPI (setupHiDPICanvas → crisp)</h2>
        <canvas id="hidpi"></canvas>
      </div>
    </div>

    <div id="hud"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
